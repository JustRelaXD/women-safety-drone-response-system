[project]
name = "overture-test"
version = "0.1.0"
description = "Emergency-response drone route planner over Overture Maps data (DuckDB Spatial)"
readme = "README.md"
authors = [
    { name = "JustRelaXD", email = "178076675+JustRelaXD@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "geopandas>=1.1.4",
    "overturemaps>=1.0.1",
    "pandas>=3.0.5",
    "pydantic>=2.0",
    "shapely>=2.1.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["planner/tests"]
addopts = "-q"
